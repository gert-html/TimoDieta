<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 110px;max-width:560px;width:100%;margin:0 auto;position:relative;z-index:1;scrollbar-width:none}

.item{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;margin-bottom:8px;border-radius:18px;background:var(--card);border:1.5px solid var(--bd);cursor:pointer;user-select:none;transition:transform .12s,border-color .2s,background .2s,opacity .2s;overflow:hidden}

.tot{background:linear-gradient(145deg,var(--hero1),var(--hero2));color:#fff;border-radius:26px;padding:20px;margin-bottom:18px;box-shadow:0 20px 40px -18px rgba(60,30,90,.55);position:relative;overflow:hidden}

.tot .sub{display:flex;gap:18px;margin-top:12px;font-size:13px;opacity:.8}
.tot .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.tot .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.tot .bar.over i{background:linear-gradient(90deg,#ff7b85,var(--bad))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:var(--shadow)}

.g .pips i{flex:1;width:auto;height:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .hd{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.card .hd span{font-size:13px;color:var(--mu);font-weight:600}
.line{display:flex;align-items:center;gap:11px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.line .bdg{width:28px;height:28px;border-radius:10px;font-size:13px}
.line .x{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.line .x small{display:block;color:var(--mu);font-size:12px;margin-top:1px;font-weight:500}
.line b{font-size:14px}
.empty{margin-top:10px;color:var(--mu);font-size:13px}
.clr{width:100%;padding:15px;border-radius:18px;border:1px solid color-mix(in srgb,var(--bad) 35%,var(--bd));background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:transform .15s}
.clr:active{transform:scale(.98)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:20;display:flex;gap:4px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--bd);box-shadow:0 18px 40px -12px rgba(0,0,0,.35)}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mu);padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;border-radius:20px;transition:all .25s;font-family:inherit}
nav button span{font-size:19px}
nav button.on{color:#1a1200;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 18px -8px var(--ac2)}
/* subscriptions */
.inp{width:100%;margin-top:10px;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit;font-size:15px;outline:none}
.inp:focus{border-color:var(--ac)}
.btn{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:15px;color:#1a1200;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
.err{color:var(--bad);font-size:13px;margin:0 4px 10px;min-height:16px}
.pls{display:flex;gap:6px;margin-top:12px}
.pl{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.pl.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1200;border-color:transparent}
</style></head><body>

<script>
const MAX=1850,CIRC=326.7;
const MEALS=["Сніданок","Обід","Вечеря","Перекус"],MI=["🌅","☀️","🌙","🍎"];
const MG=[["#ffd34d","#ff9500"],["#7dd3fc","#3b82f6"],["#c4b5fd","#7c3aed"],["#fda4af","#f43f5e"]];
const PARTS=["","⅓ порції","⅔ порції","1 порція"];
const CATS=[
["А","#3b82f6",125,"Вуглеводи",[["Бобові","35г",8],["Картопля","120г",2],["Кукурудза свіжа","120г",3],["Рис (не шліфований)","35г",3],["Будь-яка крупа","35г",3],["Цільнозернове борошно","35г",3],["Хлібці","50г",3],["Цільнозерновий хліб","55г",3],["Макарони т.с.","35г",3],["Лаваш","50г",3]]],
["Б","#ef4444",115,"Молочні",[["Сир кисломолочний нежирний (0,2% жиру)","160г",24],["Сири м'які, тверді, плавлені","32г",8],["Сметана 15%","65г",2],["Кефір 1%","270г",8],["Несолодкий йогурт 1% жиру","250г",8],["Молоко 1%","285г",8]]],
["В","#22c55e",500,"Будь-що",[["Будь-що (солодощі, снеки, ковбаса тощо)","100г",5]]],
["Д","#a855f7",190,"Білок",[["Телятина","150г",30],["Печінка","150г",27],["Куряче або індиче філе","170г",37],["Риба (до 5% жиру)","170г",34],["Риба (від 5% жиру)","135г",24],["2 яйця","100г",12],["Морепродукти","215г",43]]],
["Е","#ec4899",60,"Овочі",[["Овочі (квашені також і зелень)","300г",2],["Гриби","300г",3]]],
["Є","#8b8b99",80,"Жири",[["Будь-яка олія (рекомендуємо лляну)","9г",0],["Майонез","12г",0],["Авокадо","45г",1],["Оливки","60г",1],["Гірчиця","22г",3],["Кетчуп","33г",1],["Масло","11г",0],["Сало","9г",1]]],
["Б2","#f97316",110,"Молочні (легкі)",[["Сир кисломолочний нежирний (0,2% жиру)","135г",20],["Сири м'які, тверді, плавлені","30г",7],["Сметана 15%","60г",2],["Кефір 1%","250г",8],["Несолодкий йогурт 1% жиру","250г",8],["Молоко 1%","250г",8]]],
["З","#14b8a6",220,"Фрукти",[["Фрукти та ягоди","300г",2],["Банани, виноград, хурма","180г",3]]],
["И","#64748b",70,"Горіхи",[["Будь-які горіхи (рекомендуємо грецькі)","10г",3],["Насіння","10г",3]]],
["А2","#3b82f6",125,"Вуглеводи",[["Бобові","35г",8],["Картопля","120г",2],["Кукурудза свіжа","120г",3],["Рис (не шліфований)","35г",3],["Будь-яка крупа","35г",3],["Цільнозернове борошно","35г",3],["Хлібці","50г",3],["Цільнозерновий хліб","55г",3],["Макарони т.с.","35г",3],["Лаваш","50г",3]]],
["Д2","#a855f7",190,"Білок",[["Телятина","150г",30],["Печінка","150г",27],["Куряче або індиче філе","170г",37],["Риба (до 5% жиру)","170г",34],["Риба (від 5% жиру)","135г",24],["2 яйця","100г",12],["Морепродукти","215г",43]]]
];
let S={};try{S=JSON.parse(localStorage.getItem("td3")||"{}")}catch(e){}
let page=0,meal=null,fresh=true,pop=null;
const save=()=>{try{localStorage.setItem("td3",JSON.stringify(S))}catch(e){}};
const key=(m,c,i)=>m+"|"+c+"|"+i;
const $=id=>document.getElementById(id);
function mealStats(m){let k=0,p=0;CATS.forEach((c,ci)=>c[4].forEach((it,ii)=>{const h=S[key(m,ci,ii)]||0;k+=h*c[2]/3;p+=h*it[2]/3}));return{k,p}}
function catUsed(ci){let h=0;MEALS.forEach((_,m)=>CATS[ci][4].forEach((_,ii)=>h+=S[key(m,ci,ii)]||0));return h}
function tap(m,ci,ii){const k=key(m,ci,ii),h=S[k]||0,used=catUsed(ci);
 if(h>=3)S[k]=0;
 else if(used>=3){if(h>0)S[k]=0;else return}
 else S[k]=h+1;
 if(!S[k])delete S[k];
 pop=k;save();if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}render()}
function go(p){page=p;meal=null;fresh=true;render()}
function openMeal(m){meal=m;fresh=true;render();$("app").scrollTop=0}
function closeMeal(){meal=null;fresh=true;render()}
const r=n=>Math.round(n*10)/10;
const pips=(n,c,lg)=>`<div class="pips ${lg?"lg":""}" style="--c:${c}">${[1,2,3].map(i=>`<i class="${n>=i?"on":""}"></i>`).join("")}</div>`;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("td_theme",t)}catch(e){}}
function toggleTheme(){const d=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");setTheme(d=="dark"?"light":"dark");render()}
try{const t=localStorage.getItem("td_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const isDark=()=>{const d=document.documentElement.dataset.theme;return d?d=="dark":matchMedia("(prefers-color-scheme:dark)").matches};
function greet(){const h=new Date().getHours();return h<5?"Доброї ночі":h<12?"Доброго ранку":h<18?"Доброго дня":"Доброго вечора"}

/* ---------- підписки ---------- */
let SUB={},CODES=[],apl=1;

try{CODES=JSON.parse(localStorage.getItem("td_codes")||"[]")}catch(e){}
const sv=()=>{try{localStorage.setItem("td_sub",JSON.stringify(SUB));localStorage.setItem("td_codes",JSON.stringify(CODES))}catch(e){}};
const PL=[[1,"1 місяць"],[6,"6 місяців"],[12,"1 рік"]];
const ok=()=>SUB.admin||(SUB.exp&&SUB.exp>Date.now());
function activate(m){
 const c=$("c"+m).value.trim(),n=$("n"+m).value.trim(),e=$("e");
 if(!c||!n){e.textContent="Введи код і ім'я";return}
 if(m==12&&c=="dymofii"&&n=="dymofii"){SUB={admin:true,name:n};sv();page=2;render();return}
 const f=CODES.find(x=>x.code==c&&x.m==m&&!x.used);
 if(!f){e.textContent="Невірний код або він уже використаний";return}
 f.used=n;const d=new Date();d.setMonth(d.getMonth()+m);
 SUB={name:n,m,exp:d.getTime()};sv();page=0;render()}
function paywall(){
 $("app").innerHTML=`<div class="view"><div class="top"><div><div class="hi">Доступ</div><h1>Timo<em>Dieta</em></h1></div></div>
 <div class="sec"><h2>Обери підписку</h2><span>введи код і ім'я</span></div><div id="e" class="err"></div>`+
 PL.map(p=>`<div class="card"><div class="hd"><b>${p[1]}</b></div>
 <input id="c${p[0]}" class="inp" placeholder="Код підписки" autocomplete="off">
 <input id="n${p[0]}" class="inp" placeholder="Ім'я" autocomplete="off">
 <button class="btn" onclick="activate(${p[0]})">Активувати</button></div>`).join("")+`</div>`}
function setPl(m){apl=m;document.querySelectorAll(".pl").forEach((b,i)=>b.classList.toggle("on",PL[i][0]==m))}
function addCode(){const c=$("nc").value.trim();if(!c)return;
 if(CODES.some(x=>x.code==c)){alert("Такий код уже існує");return}
 CODES.unshift({code:c,m:apl,used:""});sv();render()}
function delCode(i){CODES.splice(i,1);sv();render()}
function logout(){if(confirm("Вийти з акаунта?")){SUB={};sv();page=0;render()}}
function adminPage(){
 $("app").innerHTML=`<div class="view"><div class="top"><div><div class="hi">Адміністратор</div><h1>Підпи<em>ски</em></h1></div><button class="ico" onclick="logout()">⎋</button></div>
 <div class="card"><div class="hd"><b>Новий код</b></div>
 <div class="pls">${PL.map(p=>`<button class="pl ${apl==p[0]?"on":""}" onclick="setPl(${p[0]})">${p[1]}</button>`).join("")}</div>
 <input id="nc" class="inp" placeholder="Промокод" autocomplete="off">
 <button class="btn" onclick="addCode()">Створити код</button></div>
 <div class="sec"><h2>Коди</h2><span>${CODES.length}</span></div>
 <div class="card">${CODES.map((x,i)=>`<div class="line" style="${i?"":"margin:0;padding:0;border:0"}"><div class="x"><b>${x.code}</b><small>${PL.find(p=>p[0]==x.m)[1]} · ${x.used?"використав: "+x.used:"вільний"}</small></div><button class="ico" style="width:34px;height:34px;font-size:15px" onclick="delCode(${i})">🗑</button></div>`).join("")||'<div class="empty">Кодів ще немає</div>'}</div></div>`}
function gate(){
 const nv=document.querySelector("nav");
 if(!ok()){nv.style.display="none";paywall();return 1}
 nv.style.display="";$("n2").style.display=SUB.admin?"":"none";
 if(page==2&&!SUB.admin)page=0;
 if(page==2){$("n0").className="";$("n1").className="";$("n2").className="on";adminPage();return 1}
 $("n2").className="";return 0}

function render(){if(gate())return;
 $("n0").className=page==0?"on":"";$("n1").className=page==1?"on":"";
 const a=$("app"),tot=MEALS.reduce((s,_,m)=>s+mealStats(m).k,0);
 const prot=MEALS.reduce((s,_,m)=>s+mealStats(m).p,0);
 const cls=fresh?"view anim":"";
 let h="";
 if(page==0&&meal===null){
  const pc=Math.min(1,tot/MAX),over=tot>MAX,off=CIRC*(1-pc);
  const date=new Date().toLocaleDateString("uk-UA",{weekday:"long",day:"numeric",month:"long"});
  h=`<div class="${cls}">
  <div class="top"><div><div class="hi">${greet()} · ${date}</div><h1>Timo<em>Dieta</em></h1></div><button class="ico" onclick="toggleTheme()">${isDark()?"☀️":"🌙"}</button></div>
  <div class="hero">
   <div class="ringw"><svg viewBox="0 0 120 120"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd34d"/><stop offset="1" stop-color="#ff7a00"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9aa2"/><stop offset="1" stop-color="#ef4452"/></linearGradient></defs>
    <circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg ${over?"over":""}" cx="60" cy="60" r="52" style="stroke-dashoffset:${off}"/></svg>
    <div class="ringc"><b>${Math.round(pc*100)}%</b><span>від норми</span></div></div>
   <div class="stats">
    <div class="stat"><div class="l">Спожито</div><div class="v">${r(tot)} <small>/ ${MAX} ккал</small></div></div>
    <div class="stat"><div class="l">${over?"Перебір":"Залишилось"}</div><div class="v ${over?"bad":""}">${r(Math.abs(MAX-tot))} <small>ккал</small></div></div>
    <div class="stat"><div class="l">Білок</div><div class="v">${r(prot)} <small>г</small></div></div>
   </div>
  </div>
  <div class="sec"><h2>Прийоми їжі</h2><span>тапни, щоб додати</span></div>`+
  MEALS.map((n,m)=>{const s=mealStats(m),w=Math.min(100,s.k/MAX*100*2.2);return`<div class="meal" style="--c1:${MG[m][0]};--c2:${MG[m][1]}" onclick="openMeal(${m})">
   <div class="mi">${MI[m]}</div>
   <div class="mb"><div class="t"><b>${n}</b><span class="k">${r(s.k)} <small>ккал</small></span></div>
   <div class="mini"><i style="width:${w}%"></i></div><div class="s">${r(s.p)} г білка</div></div><div class="chev">›</div></div>`}).join("")+`</div>`;
 }else if(page==0){
  const s=mealStats(meal);
  h=`<div class="${cls}"><div class="dh"><div class="r"><button class="back" onclick="closeMeal()">‹</button><div><h3>${MI[meal]} ${MEALS[meal]}</h3><div class="s">${r(s.p)} г білка</div></div><div class="tk">${r(s.k)}<small>ккал</small></div></div></div>
  <div class="hint">👆 Кожен тап — ще ⅓ порції, 3 тапи — повна. Ліміт категорії — на весь день.</div>`+
  CATS.map((c,ci)=>{const used=catUsed(ci),u=used*c[2]/3;return`<div class="cat"><div class="bdg" style="--c:${c[1]}">${c[0]}</div><div class="n"><b>${c[3]}</b><span>${r(u)} / ${c[2]} ккал за день</span></div>${pips(used,c[1],true)}</div>`+
  c[4].map((it,ii)=>{const k=key(meal,ci,ii),q=S[k]||0,lock=!q&&used>=3;
   return`<div class="item ${q?"s"+q:""} ${lock?"lock":""} ${pop===k?"pop":""}" style="--c:${c[1]}" onclick="tap(${meal},${ci},${ii})">
   <div class="info"><div class="nm">${it[0]}</div><div class="chips"><span>${it[1]}</span><span>${c[2]} ккал</span><span>${it[2]} г білка</span></div></div>
   <div class="side">${pips(q,c[1])}<div class="kc">${q?r(q*c[2]/3)+" ккал":""}</div></div></div>`}).join("")}).join("")+`</div>`;
 }else{
  const over=tot>MAX;
  h=`<div class="${cls}"><div class="top"><div><div class="hi">Підсумок дня</div><h1>Раці<em>он</em></h1></div><button class="ico" onclick="toggleTheme()">${isDark()?"☀️":"🌙"}</button></div>
  <div class="tot"><div class="big">${r(tot)} <small>/ ${MAX} ккал</small></div>
   <div class="sub"><span>🥩 ${r(prot)} г білка</span><span>${over?"⚠️ перебір "+r(tot-MAX):"✨ залишилось "+r(MAX-tot)}</span></div>
   <div class="bar ${over?"over":""}"><i style="width:${Math.min(100,tot/MAX*100)}%"></i></div></div>
  <div class="sec"><h2>Ліміти категорій</h2><span>використано за день</span></div>
  <div class="grid">${CATS.map((c,ci)=>`<div class="g"><div class="h"><div class="bdg" style="--c:${c[1]}">${c[0]}</div><b>${c[3]}</b></div>${pips(catUsed(ci),c[1])}</div>`).join("")}</div>
  <div class="sec"><h2>За прийомами</h2></div>`;
  MEALS.forEach((n,m)=>{const rows=[];CATS.forEach((c,ci)=>c[4].forEach((it,ii)=>{const q=S[key(m,ci,ii)]||0;if(q)rows.push(`<div class="line"><div class="bdg" style="--c:${c[1]}">${c[0]}</div><div class="x">${it[0]}<small>${PARTS[q]}</small></div><b>${r(q*c[2]/3)}</b></div>`)}));
   h+=`<div class="card"><div class="hd"><b>${MI[m]} ${n}</b><span>${r(mealStats(m).k)} ккал</span></div>${rows.join("")||'<div class="empty">Нічого не додано</div>'}</div>`});
  h+=`<button class="clr" onclick="if(confirm('Очистити день?')){S={};save();render()}">🗑 Очистити день</button></div>`;
 }
 a.innerHTML=h;fresh=false;pop=null;
 const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=isDark()?"#09090d":"#f3f1ee";
}
render();
</script></body></html>
